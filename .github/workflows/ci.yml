name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  oracle-firefox-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install plugin dependencies
        working-directory: plugins/oracle-firefox
        run: npm ci
      - name: Run portable broker and safety tests
        working-directory: plugins/oracle-firefox
        run: npm run test:portable
      - name: Run macOS Firefox BiDi fixtures
        if: matrix.os == 'macos-latest'
        working-directory: plugins/oracle-firefox
        run: npm test
      - name: Build all harness packages
        working-directory: plugins/oracle-firefox
        run: npm run build
      - name: Verify generated packages are committed
        shell: bash
        run: git diff --exit-code -- plugins/oracle-firefox/dist plugins/oracle-firefox-claude .claude-plugin
      - name: Validate MCPB
        if: matrix.os == 'ubuntu-latest'
        working-directory: plugins/oracle-firefox
        run: npx mcpb validate mcpb

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run docs:check
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm run docs:site
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm run test
      - run: pnpm run build
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm run test:packed-cli
        if: matrix.os == 'ubuntu-latest'

  # Linux parity smoke for recoverable CDP disconnect classification (issue #326 / PR #327).
  # No ChatGPT auth; exercises real Chromium DevTools against the same probe path as macOS proof.
  cdp-disconnect-proof-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v6
      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Run CDP disconnect classification proof
        env:
          CHROME_PATH: /usr/bin/chromium-browser
        run: |
          if [[ ! -x "${CHROME_PATH}" ]]; then
            if [[ -x /usr/bin/chromium ]]; then
              export CHROME_PATH=/usr/bin/chromium
            else
              echo "Chromium binary not found" >&2
              exit 1
            fi
          fi
          echo "CHROME_PATH=${CHROME_PATH}"
          node scripts/cdp-disconnect-proof.mjs
